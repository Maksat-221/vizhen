<meta name="mobile-web-app-capable" content="yes">

<title>Вижен</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-screen voice app — header with name and language, conversation in the middle, orb dock at the thumb */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --ink:#13202C; --muted:#5B6976; --line:#D3DCE5;
  --sky:#1B79CF; --sky-ink:#FFFFFF; --sky-soft:#D9E9F8; --gold:#C98B0B; --danger:#C2412D;
  --font-display:"Unbounded","Noto Sans",system-ui,sans-serif;
  --font-body:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1119; --surface:#121C27; --ink:#E5ECF3; --muted:#8B99A7; --line:#233140;
  --sky:#4AA3F0; --sky-ink:#06121D; --sky-soft:#14304A; --gold:#F0B53A; --danger:#F07560; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A1119; --surface:#121C27; --ink:#E5ECF3; --muted:#8B99A7; --line:#233140;
  --sky:#4AA3F0; --sky-ink:#06121D; --sky-soft:#14304A; --gold:#F0B53A; --danger:#F07560; color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

.app{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.who{flex:1;min-width:0}
.who h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.01em;line-height:1.1}
.who .status{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .status b{font-weight:600;color:var(--gold)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sky);color:var(--sky-ink)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;position:relative}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .dot{position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--gold);color:#1a1200;font-size:10px;font-weight:700;display:grid;place-items:center}

/* conversation */
.log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-block:8px 16px;scroll-behavior:smooth}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--sky);color:var(--sky-ink);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.interim{opacity:.6;font-style:italic}
.msg.err{border-color:var(--danger)}
.event{align-self:flex-start;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;padding-left:4px}
.event::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
.hello{margin:auto 0;display:flex;flex-direction:column;gap:14px;padding-block:12px}
.hello p{margin:0;font-size:18px;max-width:30ch;text-wrap:balance}
.hello .mode{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:14px;text-align:left}

/* running timers strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.strip:empty{display:none}
.pill{flex:none;display:flex;align-items:center;gap:8px;background:var(--sky-soft);border-radius:999px;padding:6px 6px 6px 12px;font-size:13.5px;font-variant-numeric:tabular-nums}
.pill b{font-weight:600}
.pill button{border:0;background:var(--surface);border-radius:50%;width:24px;height:24px;line-height:1;font-size:15px;color:var(--muted)}

/* dock */
.dock{padding-block:6px 14px;display:flex;flex-direction:column;align-items:center;gap:12px}
.orb{--s:88px;width:var(--s);height:var(--s);border-radius:50%;border:0;padding:0;position:relative;
  background:radial-gradient(circle at 34% 30%, #8FD0FF 0%, var(--sky) 52%, #0C4F8F 100%);
  box-shadow:0 0 0 3px var(--gold), 0 10px 30px -8px rgba(27,121,207,.55);transition:transform .2s}
.orb:active{transform:scale(.96)}
.orb svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;position:absolute;inset:0;margin:auto}
.orb::before,.orb::after{content:"";position:absolute;inset:-3px;border-radius:50%;pointer-events:none}
.orb[data-state="listening"]::before{border:2px solid var(--sky);animation:ring 1.4s ease-out infinite}
.orb[data-state="listening"]::after{border:2px solid var(--sky);animation:ring 1.4s .7s ease-out infinite}
.orb[data-state="thinking"]::before{inset:-9px;background:conic-gradient(var(--gold) 0 25%, transparent 25% 100%);
  -webkit-mask:radial-gradient(circle, transparent 61%, #000 62%);mask:radial-gradient(circle, transparent 61%, #000 62%);animation:spin 1s linear infinite}
.orb[data-state="speaking"]{animation:breathe 1.1s ease-in-out infinite}
.orb[data-state="standby"]::before{border:2px solid var(--gold);animation:ring 2.6s ease-out infinite}
.wake{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--muted)}
.wake::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
.wake[aria-pressed="true"]{color:var(--ink);border-color:var(--gold)}
.wake[aria-pressed="true"]::before{background:var(--gold)}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes breathe{50%{transform:scale(1.06)}}
.hint{font-size:12.5px;color:var(--muted);text-align:center;min-height:1.2em;max-width:36ch}
.typebar{width:100%;display:flex;gap:8px}
.typebar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 16px;font-size:16px}
.typebar button{border:0;border-radius:999px;background:var(--ink);color:var(--bg);padding:0 16px;font-weight:600}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(5,12,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;
  padding-block:18px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet h2{margin:0;font-family:var(--font-display);font-weight:500;font-size:18px}
.sheet h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.close{border:0;background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600}
.group{display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.row .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.row button{border:0;background:none;color:var(--danger);font-size:13px;font-weight:600;padding:4px}
.empty{padding:14px;color:var(--muted);font-size:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
label.f input,label.f textarea,label.f select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:16px;font-weight:400}
label.f textarea{resize:vertical;min-height:70px}
label.check{display:flex;align-items:center;gap:10px;font-size:15px}
label.check input{width:20px;height:20px;accent-color:var(--sky)}
.note{font-size:13px;color:var(--muted);margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--sky);border-color:var(--sky);color:var(--sky-ink)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:16px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sky-soft)}

/* alarm */
.alarm{position:fixed;inset:0;z-index:30;background:var(--sky);color:var(--sky-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.alarm .k{font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.alarm .t{font-family:var(--font-display);font-size:30px;font-weight:700;max-width:16ch;text-wrap:balance}
.alarm button{border:0;background:var(--sky-ink);color:var(--sky);border-radius:999px;padding:14px 34px;font-size:17px;font-weight:700}
@media (prefers-reduced-motion: reduce){.orb::before,.orb::after,.orb{animation:none!important}}
</style>

<div class="app">
  <div class="top">
    <div class="who">
      <h1 id="name">Вижен</h1>
      <div class="status" id="status"></div>
    </div>
    <div class="seg" id="langs" role="group" aria-label="Language">
      <button data-l="ru">RU</button><button data-l="kk">KZ</button><button data-l="en">EN</button>
    </div>
    <button class="icon-btn" id="openTasks" aria-label="Tasks">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
      <span class="dot" id="taskCount" hidden></span>
    </button>
    <button class="icon-btn" id="openSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>

  <div class="log" id="log" aria-live="polite"></div>

  <div class="strip" id="strip"></div>
  <div class="dock">
    <button class="orb" id="orb" data-state="idle" aria-label="Talk">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
    </button>
    <div class="hint" id="hint"></div>
    <button class="wake" id="wakeBtn" type="button" aria-pressed="false"></button>
    <form class="typebar" id="typebar">
      <input id="text" autocomplete="off" enterkeyhint="send">
      <button id="sendBtn" type="submit"></button>
    </form>
  </div>
</div>

<div class="scrim" id="tasksSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <header><h2 data-t="tasks"></h2><button class="close" data-close data-t="close"></button></header>
    <div class="group"><h3 data-t="timers"></h3><div class="list" id="timerList"></div></div>
    <div class="group"><h3 data-t="notes"></h3>
      <form class="addrow" id="noteForm"><input id="noteInput" autocomplete="off"><button class="btn primary" data-t="add"></button></form>
      <div class="list" id="noteList"></div></div>
    <p class="note" data-t="bgNote"></p>
  </div>
</div>

<div class="scrim" id="settingsSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <header><h2 data-t="settings"></h2><button class="close" data-close data-t="close"></button></header>
    <label class="f"><span data-t="sName"></span><input id="sName" maxlength="30"></label>
    <label class="f"><span data-t="sPersona"></span><textarea id="sPersona" maxlength="400"></textarea></label>
    <label class="f"><span data-t="sCity"></span><input id="sCity" maxlength="60"></label>
    <label class="check"><input type="checkbox" id="sVoice"><span data-t="sVoice"></span></label>
    <label class="check"><input type="checkbox" id="sKeep"><span data-t="sKeep"></span></label>
    <label class="f"><span data-t="sRate"></span><input type="range" id="sRate" min="0.7" max="1.4" step="0.05"></label>
    <label class="check"><input type="checkbox" id="sNice"><span data-t="sNice"></span></label>
    <label class="f"><span data-t="sTtsVoice"></span><select id="sTtsVoice">
      <option value="ash">Ash</option><option value="onyx">Onyx</option><option value="echo">Echo</option><option value="verse">Verse</option><option value="ballad">Ballad</option>
      <option value="sage">Sage</option><option value="coral">Coral</option><option value="nova">Nova</option><option value="shimmer">Shimmer</option><option value="alloy">Alloy</option></select></label>
    <p class="note" data-t="nVoice"></p>
    <div class="addrow"><button class="btn" id="testVoice" type="button" data-t="testVoice"></button><button class="btn" id="askNotif" type="button" data-t="notif"></button></div>
    <div class="group">
      <h3 data-t="brain"></h3>
      <div><span class="badge" id="brainBadge"></span></div>
      <p class="note" id="brainNote"></p>
      <label class="f" id="keyField"><span data-t="sKey"></span><input id="sKey" type="password" autocomplete="off" placeholder="sk-ant-..."></label>
      <label class="f" id="modelField"><span data-t="sModel"></span><input id="sModel" autocomplete="off"></label>
    </div>
    <div class="group">
      <h3 data-t="sStt"></h3>
      <div><span class="badge" id="sttBadge"></span></div>
      <p class="note" data-t="nStt"></p>
      <label class="f"><span data-t="sSttKey"></span><input id="sSttKey" type="password" autocomplete="off" placeholder="sk-..."></label>
      <label class="f"><span data-t="sSttModel"></span><input id="sSttModel" autocomplete="off"></label>
      <label class="f"><span data-t="sVocab"></span><textarea id="sVocab" maxlength="600"></textarea></label>
    </div>
    <div class="addrow"><button class="btn" id="clearChat" type="button" data-t="clearChat"></button></div>
  </div>
</div>

<div class="alarm" id="alarm" hidden>
  <div class="k" id="alarmKind"></div>
  <div class="t" id="alarmText"></div>
  <button id="alarmStop"></button>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const KEY = "tumar.v1";

/* ---------- state ---------- */
const DEF = {
  settings:{ name:"Вижен", persona:"", lang:"ru", city:"", voice:true, keep:false, wake:false, rate:1, apiKey:"", model:"claude-haiku-5-5", sttKey:"", sttModel:"gpt-4o-transcribe", vocab:"", nice:true, ttsVoice:"ash" },
  notes:[], timers:[], history:[]
};
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch { S = null; }
S = Object.assign({}, DEF, S || {});
S.settings = Object.assign({}, DEF.settings, S.settings || {});
if (S.settings.name === "Тұмар") S.settings.name = "Вижен";
for (const k of ["notes","timers","history"]) if (!Array.isArray(S[k])) S[k] = [];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const uid = () => Math.random().toString(36).slice(2, 8);

/* ---------- language ---------- */
const LANG = {
  ru:{ sr:"ru-RU", tts:"ru", name:"Russian", loc:"ru-RU" },
  kk:{ sr:"kk-KZ", tts:"kk", name:"Kazakh", loc:"kk-KZ" },
  en:{ sr:"en-US", tts:"en", name:"English", loc:"en-US" }
};
const T = {
  ru:{ idle:"Нажми на шар и говори", listening:"Слушаю…", thinking:"Думаю…", speaking:"Говорю", type:"Или напиши…", send:"Отпр.",
    hello:n=>`Привет! Я ${n}. Спроси что угодно, поставь таймер или попроси записать заметку.`,
    chips:["Какая погода завтра?","Поставь таймер на 10 минут","Запиши: купить хлеб","Напомни через 30 минут позвонить маме","Сколько времени в Пекине?"],
    tasks:"Дела", timers:"Таймеры и напоминания", notes:"Заметки", close:"Готово", add:"Добавить", noTimers:"Ничего не запущено", noNotes:"Заметок пока нет", del:"Удалить",
    bgNote:"Таймеры и напоминания срабатывают, пока приложение открыто. Свёрнутое приложение браузер может приостановить.",
    settings:"Настройки", sName:"Имя ассистента", sPersona:"Характер", sCity:"Город для погоды (пусто — по геолокации)", sVoice:"Отвечать голосом", sKeep:"Слушать снова после ответа", sRate:"Скорость речи",
    testVoice:"Проверить голос", notif:"Разрешить уведомления", brain:"Мозг ассистента", sKey:"Ключ Anthropic API", sModel:"Модель", clearChat:"Очистить разговор",
    bClaude:"Claude через твой аккаунт", bApi:"Claude API по твоему ключу", bLocal:"Базовый режим без ИИ",
    nClaude:"Отвечает Claude на твоём аккаунте claude.ai. Ключ не нужен. При первом вопросе появится запрос на разрешение.",

    micBlocked:"Микрофон здесь недоступен. Нажми на поле ввода и продиктуй через микрофон на клавиатуре.",

    timer:"Таймер", reminder:"Напоминание", stop:"Стоп", timerDone:l=>`Таймер${l?" «"+l+"»":""} закончился.`, remind:t=>`Напоминаю: ${t}`,
    voiceTest:n=>`Привет, я ${n}. Так звучит мой голос.`, err:"Не получилось ответить. Попробуй ещё раз.", keyBad:"Ключ API не подошёл. Проверь его в настройках.",
    limit:"Слишком много запросов. Подожди немного.", denied:"Доступ к Claude не разрешён. Можно вставить свой API-ключ в настройках." },
  kk:{ idle:"Шарды басып, сөйле", listening:"Тыңдап тұрмын…", thinking:"Ойланып жатырмын…", speaking:"Сөйлеп тұрмын", type:"Немесе жаз…", send:"Жіберу",
    hello:n=>`Сәлем! Мен ${n}. Кез келген сұрақ қой, таймер қойғыз немесе жазба жаздыр.`,
    chips:["Ертең ауа райы қандай?","10 минутқа таймер қой","Жазып ал: нан сатып алу","30 минуттан кейін анама қоңырау шалуды еске сал","Сағат неше?"],

const pad = n => String(n).padStart(2, "0");
const localStamp = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "local";
const fmtClock = d => d.toLocaleTimeString(LANG[S.settings.lang].loc, {hour:"2-digit", minute:"2-digit"});
function fmtLeft(ms){
  const s = Math.max(0, Math.round(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`;
}

/* ---------- tools (shared by every brain) ---------- */
const WMO = c => {
  const g = c===0?0 : c<=2?1 : c===3?2 : c<=48?3 : c<=57?4 : c<=67?5 : c<=77?6 : c<=82?7 : c<=86?8 : 9;
  return [["ясно","ашық","clear"],["переменная облачность","аздап бұлтты","partly cloudy"],["пасмурно","бұлтты","overcast"],["туман","тұман","fog"],
    ["морось","сіркіреме жаңбыр","drizzle"],["дождь","жаңбыр","rain"],["снег","қар","snow"],["ливень","нөсер","showers"],["снегопад","қар жауады","snow showers"],["гроза","найзағай","thunderstorm"]][g][{ru:0,kk:1,en:2}[S.settings.lang]];
};
function geo(){
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error("no geolocation"));
    navigator.geolocation.getCurrentPosition(p => res(p.coords), () => rej(new Error("location denied")), {timeout:8000, maximumAge:600000});
  });
}
async function getWeather(city, days){
  days = Math.min(Math.max(Number(days) || 1, 1), 7);
  let lat, lon, place;
  city = String(city || S.settings.city || "").trim();
  try {
    if (city){
      const g = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&language=${S.settings.lang==="en"?"en":"ru"}&name=${encodeURIComponent(city)}`)).json();
      if (!g.results || !g.results.length) throw new Error("city not found: " + city);
      ({latitude:lat, longitude:lon} = g.results[0]); place = g.results[0].name + (g.results[0].country ? ", " + g.results[0].country : "");
    } else {
      const c = await geo(); lat = c.latitude; lon = c.longitude; place = "current location";
    }
    const w = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=${days+1}`)).json();
    const cur = w.current;
    return { place,
      now:{ temp_c:cur.temperature_2m, feels_c:cur.apparent_temperature, wind_kmh:cur.wind_speed_10m, sky:WMO(cur.weather_code) },
      days: w.daily.time.map((d,i) => ({ date:d, min_c:w.daily.temperature_2m_min[i], max_c:w.daily.temperature_2m_max[i], rain_chance:w.daily.precipitation_probability_max[i], sky:WMO(w.daily.weather_code[i]) })) };
  } catch (e) {
    if (/city not found|location denied|no geolocation/.test(e.message)) throw e;
    throw new Error("Weather service unreachable from this view. It works when the app is opened from its own website.");
  }
}

  const tm = { id:uid(), kind, due, label:String(label || "").slice(0, 120) };
  S.timers.push(tm); save(); renderTasks(); return tm;

  return `You are a voice assistant on the user's phone. Your name is ${S.settings.name}. Personality: ${persona()}
Now: ${localStamp(now)} (${now.toLocaleDateString("en-US",{weekday:"long"})}), timezone ${tz}. Interface language: ${LANG[S.settings.lang].name}.

- Reply in the language the user just used (Russian, Kazakh or English). If unclear, use ${LANG[S.settings.lang].name}. Kazakh must be written in Kazakh Cyrillic.

- Use the tools for time in other cities, weather, timers, reminders and notes. Never invent weather.

}

const clean = s => String(s).replace(/[*_#`>]+/g, "").replace(/\n{3,}/g, "\n\n").trim();

async function ask(text){
  text = String(text || "").trim(); if (!text) return;
  stopWake();
  const wm = wakeMatch(text, wakeRe());
  if (wm && wm.rest) text = wm.rest;
  if (busy) busy.abort();
  stopSpeaking();
  addMsg("me", text);
  setStatus("thinking");
  const ctl = new AbortController(); busy = ctl;
  let reply = "", bubble = null, isErr = false;
  try {
    const mode = brain();
    if (mode === "local" || (mode === "claude" && !sampleTools)) {
      const local = await localIntent(text);
      if (local != null) reply = local;
    }
    if (!reply) {
      if (mode === "claude") reply = await askSample(text, ctl, b => bubble = b);
      else if (mode === "api") reply = await askApi(text, ctl);
      else reply = t("nLocal");
    }
    if (ctl.signal.aborted) return;
    reply = clean(reply);
    pushHistory("user", text); pushHistory("assistant", reply);
  } catch (e) {
    if (ctl.signal.aborted || e?.code === "cancelled" || e?.name === "AbortError") { if (bubble && !bubble.textContent) bubble.remove(); setStatus("idle"); afterTurn(true); return; }
    isErr = true;
    reply = e?.code === "rate_limited" || e?.status === 429 ? t("limit")
      : e?.code === "not_granted" || e?.code === "sampling_disabled" ? t("denied")
      : e?.status === 401 ? t("keyBad") : t("err");
    if (e?.code === "not_granted" || e?.code === "sampling_disabled") { sampleFn = null; renderBrain(); }
  } finally { if (busy === ctl) busy = null; }
  if (bubble) { bubble.textContent = reply; if (isErr) bubble.classList.add("err"); }
  else addMsg("bot", reply, isErr ? "err" : "");
  speak(reply);
}

async function askSample(text, ctl, setBubble){
  const turns = [{role:"user", content:rules()}];
  const h = S.history.slice(-12);
  // history must alternate after the rules turn; consecutive same-role turns are allowed
  for (const m of h) turns.push({role:m.role, content:m.content});
  turns.push({role:"user", content:text});
  let bubble = null;
  const opts = { signal:ctl.signal, cache:false, modelTier:"quick",
    onText:({text}) => { if (!bubble){ bubble = addMsg("bot", ""); setBubble(bubble); } bubble.textContent = clean(text); scrollDown(); } };
  if (sampleTools) opts.tools = TOOLS.map(x => ({name:x.name, description:x.description, inputSchema:x.inputSchema || {type:"object", properties:{}}, execute:x.execute}));
  const r = await sampleFn(turns, opts);
  return r.text.split(/\n\s*\n/).pop() || r.text; // with tools, keep the final round's words
}

async function askApi(text, ctl){
  const msgs = S.history.slice(-12).map(m => ({role:m.role, content:m.content}));
  while (msgs.length && msgs[0].role !== "user") msgs.shift();
  msgs.push({role:"user", content:text});
  const tools = TOOLS.map(x => ({name:x.name, description:x.description, input_schema:x.inputSchema || {type:"object", properties:{}}}));
  for (let round = 0; round < 5; round++){
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", signal:ctl.signal,
      headers:{ "content-type":"application/json", "x-api-key":S.settings.apiKey.trim(), "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body:JSON.stringify({ model:S.settings.model.trim() || DEF.settings.model, max_tokens:700, system:rules(), tools, messages:msgs })
    });
    if (!res.ok) { const e = new Error("api " + res.status); e.status = res.status; throw e; }
    const data = await res.json();
    msgs.push({role:"assistant", content:data.content});
    const uses = data.content.filter(b => b.type === "tool_use");
    if (data.stop_reason !== "tool_use" || !uses.length)
      return data.content.filter(b => b.type === "text").map(b => b.text).join(" ").trim() || "…";
    const results = [];
    for (const u of uses){
      const tool = TOOLS.find(x => x.name === u.name);
      try { const out = await tool.execute(u.input || {}); results.push({type:"tool_result", tool_use_id:u.id, content:typeof out === "string" ? out : JSON.stringify(out)}); }
      catch (err) { results.push({type:"tool_result", tool_use_id:u.id, content:"Error: " + (err.message || err), is_error:true}); }
    }
    msgs.push({role:"user", content:results});
  }
  return t("err");
}

/* basic offline understanding: time, timers, notes, weather */
async function localIntent(raw){
  const s = raw.toLowerCase().replace(/ё/g, "е");
  const num = s.match(/(\d+(?:[.,]\d+)?)/);
  const n = num ? parseFloat(num[1].replace(",", ".")) : null;
  if (/(таймер|timer|засеки)/.test(s) && n){
    const unit = /(час|hour|сағат)/.test(s) ? 3600 : /(сек|second|sec)/.test(s) ? 1 : 60;
    await TOOLS.find(x => x.name === "set_timer").execute({seconds:Math.round(n*unit)});
    return L(`Готово, таймер на ${fmtLeft(n*unit*1000)}.`, `Дайын, таймер ${fmtLeft(n*unit*1000)} қойылды.`, `Done, timer set for ${fmtLeft(n*unit*1000)}.`);
  }
  const rm = s.match(/(?:напомни|еске сал|remind me)/);
  if (rm && n && /(мин|minute|сағат|час|hour)/.test(s)){
    const mins = /(час|hour|сағат)/.test(s) ? n*60 : n;
    const what = raw.replace(/.*?(?:\d+[.,]?\d*)\s*\S+\s*/, "").trim() || raw;
    await TOOLS.find(x => x.name === "set_reminder").execute({text:what, in_minutes:mins});
    return L(`Хорошо, напомню через ${mins} мин.`, `Жарайды, ${mins} минуттан кейін еске саламын.`, `OK, I'll remind you in ${mins} min.`);
  }
  const note = raw.match(/^\s*(?:запиши|запомни|заметка|жазып ал|жаз|note|write down|remember)\s*[:,—-]?\s*(.+)$/i);
  if (note){ await TOOLS.find(x => x.name === "add_note").execute({text:note[1]}); return L("Записал.", "Жазып алдым.", "Noted."); }
  if (/(мои заметки|покажи заметки|жазбалар|my notes)/.test(s)){
    if (!S.notes.length) return t("noNotes") + ".";
    return S.notes.slice(0, 5).map(x => x.text).join(". ") + ".";
  }
  if (/(который час|сколько времени|сағат неше|what time|time is it|^время)/.test(s))
    return L(`Сейчас ${fmtClock(new Date())}.`, `Қазір сағат ${fmtClock(new Date())}.`, `It's ${fmtClock(new Date())}.`);
  if (/(погод|ауа райы|weather)/.test(s)){
    const cm = raw.match(/(?:\sв\s|\sво\s|\sin\s)([A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі-]+)/) || raw.match(/([A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі-]+)(?:да|де|та|те)\s+ауа/);
    const tomorrow = /(завтра|ертең|tomorrow)/.test(s);
    try {
      const w = await getWeather(cm ? cm[1] : "", tomorrow ? 2 : 1);
      if (tomorrow){ const d = w.days[1]; return L(`Завтра ${d.sky}, от ${Math.round(d.min_c)} до ${Math.round(d.max_c)} градусов.`, `Ертең ${d.sky}, ${Math.round(d.min_c)}-ден ${Math.round(d.max_c)} градусқа дейін.`, `Tomorrow: ${d.sky}, ${Math.round(d.min_c)} to ${Math.round(d.max_c)} degrees.`); }
      return L(`Сейчас ${Math.round(w.now.temp_c)} градусов, ${w.now.sky}.`, `Қазір ${Math.round(w.now.temp_c)} градус, ${w.now.sky}.`, `It's ${Math.round(w.now.temp_c)} degrees and ${w.now.sky}.`);
    } catch (e) { return L("Не получилось узнать погоду. ", "Ауа райын біле алмадым. ", "Couldn't get the weather. ") + (/unreachable/.test(e.message) ? L("Здесь погода недоступна, открой приложение с сайта.", "Мұнда ауа райы қолжетімсіз.", "Weather isn't reachable in this view.") : ""); }
  }
  return null;
}

let voices = [];
const loadVoices = () => { try { voices = speechSynthesis.getVoices(); } catch {} };
if ("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang){
  const by = p => voices.filter(v => v.lang.toLowerCase().replace("_","-").startsWith(p));
  const list = by(lang).length ? by(lang) : (lang === "kk" ? by("ru") : []);
  return list.find(v => /premium|enhanced|natural|google/i.test(v.name)) || list[0] || null;
}
let ttsAudio = null, ttsCtl = null;
const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
const niceVoice = () => S.settings.nice && !!S.settings.sttKey.trim();
function stopSpeaking(){
  try { speechSynthesis.cancel(); } catch {}
  if (ttsCtl){ ttsCtl.abort(); ttsCtl = null; }
  if (ttsAudio && !ttsAudio.paused){ try { ttsAudio.pause(); } catch {} }
}
async function cloudSpeak(text){
  const ctl = new AbortController(); ttsCtl = ctl;
  try {
    const lang = detectLang(text);
    const res = await fetch("https://api.openai.com/v1/audio/speech", {
      method:"POST", signal:ctl.signal,
      headers:{ Authorization:"Bearer " + S.settings.sttKey.trim(), "Content-Type":"application/json" },
      body:JSON.stringify({ model:"gpt-4o-mini-tts", voice:S.settings.ttsVoice || "ash", input:text, response_format:"mp3",
        instructions:`Speak ${LANG[lang].name}${lang === "kk" ? " with natural native Kazakh pronunciation" : ""}. You are a friendly voice assistant named ${S.settings.name}; sound warm, natural and conversational, not robotic. Personality: ${persona()}${Number(S.settings.rate) > 1.1 ? " Speak a little faster than usual." : Number(S.settings.rate) < 0.9 ? " Speak a little slower than usual." : ""}` })
    });
    if (!res.ok) return false;
    const blob = await res.blob();
    if (ctl.signal.aborted) return "stopped";
    const a = ttsAudio || (ttsAudio = new Audio());
    const url = URL.createObjectURL(blob);
    a.src = url;
    return await new Promise(resolve => {
      const fin = r => { a.onended = a.onerror = a.onpause = null; URL.revokeObjectURL(url); resolve(r); };
      a.onended = () => fin(true);
      a.onerror = () => fin(false);
      a.onpause = () => { if (!a.ended) fin("stopped"); };
      a.play().then(() => setStatus("speaking")).catch(() => fin(false));
    });
  } catch { return ctl.signal.aborted ? "stopped" : false; }
  finally { if (ttsCtl === ctl) ttsCtl = null; }
}
function browserSpeak(text, done){
  if (!("speechSynthesis" in window)){ setStatus("idle"); done(); return; }
  const lang = detectLang(text);
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(lang);
  if (v){ u.voice = v; u.lang = v.lang; } else u.lang = LANG[lang].sr;
  u.rate = Number(S.settings.rate) || 1;
  u.onstart = () => setStatus("speaking");
  u.onend = u.onerror = done;
  setStatus("idle");
  speechSynthesis.speak(u);
  setTimeout(() => { if (!speechSynthesis.speaking && !speechSynthesis.pending) done(); }, 3000);
}
function speak(text, force){
  stopWake();
  if ((!S.settings.voice && !force) || !text){ setStatus("idle"); afterTurn(force); return; }
  stopSpeaking();
  let ended = false;
  const done = () => { if (ended) return; ended = true; if (orb.dataset.state === "speaking") setStatus("idle"); afterTurn(force); };
  if (niceVoice()){
    setStatus("speaking");
    cloudSpeak(text).then(r => {
      if (r === true) done();
      else if (r === false) browserSpeak(text, done);
      else if (orb.dataset.state === "speaking") setStatus("idle");
    });
    return;
  }
  browserSpeak(text, done);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, micBlocked = false, interimEl = null;
function dictationTip(key){ $("hint").textContent = t(key); $("text").focus(); }
function listen(){
  if (useCloud()) { cloudListen(); return; }
  if (!SR){ dictationTip("noSR"); return; }
  if (micBlocked){ dictationTip("micBlocked"); return; }
  stopWake();
  stopSpeaking();
  try { rec = new SR(); } catch { dictationTip("noSR"); return; }
  rec.lang = LANG[S.settings.lang].sr; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  let finalText = "", lastInterim = "";
  rec.onstart = () => setStatus("listening");
  rec.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    lastInterim = (finalText + interim).trim();
    if (!interimEl) interimEl = addMsg("me", "", "interim");
    interimEl.textContent = lastInterim;
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture"){ micBlocked = true; setStatus("idle"); dictationTip("micBlocked"); }
    else if (e.error === "language-not-supported"){ setStatus("idle"); dictationTip("srLang"); }
  };
  rec.onend = () => {
    rec = null;
    if (interimEl){ interimEl.remove(); interimEl = null; }
    const said = (finalText || lastInterim).trim();
    if (orb.dataset.state === "listening") setStatus("idle");
    if (said) ask(said); else afterTurn(true);
  };
  try { rec.start(); } catch { setStatus("idle"); }
}

/* accurate recognition: record, cut on silence, send to OpenAI */
let cloudRec = null;
const useCloud = () => !!S.settings.sttKey.trim() && !!(navigator.mediaDevices && window.MediaRecorder);
async function cloudListen(){
  stopWake(); stopSpeaking(); unlock();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}}); }
  catch { micBlocked = true; dictationTip("micBlocked"); return; }
  const mime = ["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg"].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
  let mr; try { mr = new MediaRecorder(stream, mime ? {mimeType:mime} : undefined); } catch { stream.getTracks().forEach(x => x.stop()); dictationTip("noSR"); return; }
  const chunks = []; mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  let an = null, src = null;
  try { src = actx.createMediaStreamSource(stream); an = actx.createAnalyser(); an.fftSize = 1024; src.connect(an); } catch {}
  const buf = new Float32Array(1024), t0 = Date.now();
  let spoke = !an, lastLoud = Date.now(), floor = 0, nf = 0;
  cloudRec = { stop: () => { if (mr.state !== "inactive") mr.stop(); } };
  const tick = () => {
    if (mr.state === "inactive") return;
    const now = Date.now();
    if (an){
      an.getFloatTimeDomainData(buf);
      let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i]*buf[i];
      const rms = Math.sqrt(sum / buf.length);
      if (now - t0 < 300){ floor = (floor*nf + rms)/(++nf); }
      else if (rms > Math.max(0.015, floor*3)){ spoke = true; lastLoud = now; }
      if ((spoke && now - lastLoud > 1300) || (!spoke && now - t0 > 7000)) { mr.stop(); return; }
    }
    if (now - t0 > 30000){ mr.stop(); return; }
    setTimeout(tick, 60);
  };
  mr.onstop = async () => {
    stream.getTracks().forEach(x => x.stop()); try { src && src.disconnect(); } catch {}
    cloudRec = null;
    if (!spoke || !chunks.length){ setStatus("idle"); afterTurn(true); return; }
    const blob = new Blob(chunks, {type: mr.mimeType || mime || "audio/webm"});
    setStatus("thinking");
    try {
      const text = await transcribe(blob);
      if (text) ask(text); else { setStatus("idle"); afterTurn(true); }
    } catch { addMsg("bot", t("sttErr"), "err"); setStatus("idle"); afterTurn(true); }
  };
  mr.start(250); setStatus("listening"); tick();
}
async function transcribe(blob){
  const ext = /mp4|m4a|aac/.test(blob.type) ? "m4a" : /ogg/.test(blob.type) ? "ogg" : "webm";
  const fd = new FormData();
  fd.append("file", blob, "speech." + ext);
  fd.append("model", S.settings.sttModel.trim() || "gpt-4o-transcribe");
  const vocab = S.settings.vocab.trim();
  fd.append("prompt", `Говорящий из Казахстана, говорит по-русски, по-казахски (қазақша) или по-английски, иногда смешивая языки. Пиши казахские слова казахской кириллицей (ә, ғ, қ, ң, ө, ұ, ү, һ, і). Ассистента зовут ${S.settings.name} (Vision).` + (vocab ? " Частые слова: " + vocab + "." : ""));
  const res = await fetch("https://api.openai.com/v1/audio/transcriptions", { method:"POST", headers:{ Authorization:"Bearer " + S.settings.sttKey.trim() }, body:fd });
  if (!res.ok) throw new Error("stt " + res.status);
  const j = await res.json();
  return String(j.text || "").trim();
}

/* ---------- wake word ---------- */
const WAKE_WORDS = ["vision","visions","visio","fashion","фэшн","фешн","вижен","вижн","виждн","визион","вижин","вижон","вижэн","уижен","вишен","вижень"];
const esc = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function wakeRe(){
  const names = [...new Set([S.settings.name.toLowerCase(), ...WAKE_WORDS])].filter(Boolean).map(esc).join("|");
  return new RegExp("(?:^|[\\s,.!?])(" + names + ")(?=$|[\\s,.!?])", "i");
}
/* match the name by sound, not spelling: "Вижен", "вижн", "Vision", "fashion", "фэшн" all reduce to the same key */
const CYR = {а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"i",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"ts",ч:"ch",ш:"sh",щ:"sh",ы:"i",э:"e",ю:"yu",я:"ya",ә:"a",ғ:"g",қ:"k",ң:"n",ө:"o",ұ:"u",ү:"u",һ:"h",і:"i",ь:"",ъ:""};
function soundKey(w){
  w = [...String(w).toLowerCase()].map(c => CYR[c] ?? c).join("").replace(/[^a-z]/g, "");
  return w.replace(/ph/g, "f").replace(/(zh|sh|ch|ss|s|z|j|dg|g(?=[ei]))/g, "z").replace(/[fw]/g, "v").replace(/[aeiouy]/g, "").replace(/(.)\1+/g, "$1");
}
const WAKE_STOP = new Set(["весна","весну","весне","весной","весны","визе","визу","fusion"]);
function wakeMatch(text, re){
  const words = String(text).trim().split(/\s+/);
  const keys = new Set(["vzn", soundKey(S.settings.name)]);
  for (let i = 0; i < Math.min(2, words.length); i++){
    const raw = words[i].toLowerCase().replace(/[^\p{L}]/gu, "");
    if (!raw || WAKE_STOP.has(raw)) continue;
    const k = soundKey(raw);
    if (re.test(" " + raw + " ") || (raw.length <= 9 && keys.has(k)))
      return { rest: words.slice(i + 1).join(" ").replace(/^[\s,.!?—-]+/, "").trim() };
  }
  return null;
}
let wakeRec = null, wakeStopping = false, quickFails = 0, wakeLock = null;
const wakeAllowed = () => S.settings.wake && SR && !micBlocked;
function afterTurn(onlyWake){
  if (!onlyWake && S.settings.keep && (SR || useCloud()) && !micBlocked){ setTimeout(listen, 250); return; }
  if (S.settings.wake) setTimeout(startWake, 350);
}
function chime(){
  if (!actx) return;
  const now = actx.currentTime;
  [[660,0],[990,.12]].forEach(([f,off]) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = f; g.gain.setValueAtTime(0.0001, now+off); g.gain.exponentialRampToValueAtTime(0.25, now+off+.02); g.gain.exponentialRampToValueAtTime(0.0001, now+off+.16);
    o.connect(g).connect(actx.destination); o.start(now+off); o.stop(now+off+.18);
  });
}
function stopWake(){
  if (!wakeRec) return;
  wakeStopping = true;
  const r = wakeRec; wakeRec = null;
  try { r.abort(); } catch {}
  if (orb.dataset.state === "standby") setStatus("idle");
}
function startWake(){
  if (!S.settings.wake) return;
  if (!SR || micBlocked){ dictationTip(SR ? "micBlocked" : "noSR"); return; }
  if (wakeRec || rec || cloudRec || busy || ringing || (window.speechSynthesis && speechSynthesis.speaking) || document.hidden) return;
  let r; try { r = new SR(); } catch { return; }
  r.lang = LANG[S.settings.lang].sr; r.continuous = true; r.interimResults = false; r.maxAlternatives = 3;
  wakeRec = r; wakeStopping = false;
  const began = Date.now();
  r.onstart = () => { if (wakeRec === r) setStatus("standby"); };
  r.onresult = e => {
    const re = wakeRe();
    for (let i = e.resultIndex; i < e.results.length; i++){
      const res = e.results[i]; if (!res.isFinal) continue;
      for (let a = 0; a < res.length; a++){
        const hit = wakeMatch(res[a].transcript, re);
        if (hit){ quickFails = 0; wakeHeard(hit.rest); return; }
      }
    }
  };
  r.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture"){ micBlocked = true; S.settings.wake = false; save(); renderWake(); dictationTip("micBlocked"); }
    else if (e.error === "language-not-supported"){ S.settings.wake = false; save(); renderWake(); dictationTip("srLang"); }
  };
  r.onend = () => {
    const mine = wakeRec === r; if (mine) wakeRec = null;
    if (!mine || wakeStopping){ wakeStopping = false; return; }
    if (orb.dataset.state === "standby") setStatus("idle");
    quickFails = Date.now() - began < 1500 ? quickFails + 1 : 0;
    if (quickFails >= 5){ quickFails = 0; $("hint").textContent = t("wakeStalled"); return; }
    if (wakeAllowed()) setTimeout(startWake, 250);
  };
  try { r.start(); } catch { wakeRec = null; }
}
function wakeHeard(rest){
  stopWake(); chime();
  try { navigator.vibrate && navigator.vibrate(40); } catch {}
  if (rest.length > 1) ask(rest); else setTimeout(listen, 300);
}
async function holdScreen(on){
  try {
    if (on && !wakeLock && navigator.wakeLock && !document.hidden){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch {}
}
function renderWake(){
  const b = $("wakeBtn"); if (!b) return;
  b.textContent = T[S.settings.lang].wakeBtn(S.settings.name);
  b.setAttribute("aria-pressed", String(!!S.settings.wake));
  holdScreen(!!S.settings.wake);
}
$("wakeBtn").onclick = () => {
  unlock();
  S.settings.wake = !S.settings.wake; save(); renderWake();
  if (S.settings.wake){ micBlocked = false; quickFails = 0; startWake(); }
  else { stopWake(); setStatus("idle"); }
};
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopWake();
  else if (S.settings.wake){ holdScreen(true); startWake(); }
});

/* ---------- timers & alarms ---------- */
let ringing = null, beepTimer = null;
function beep(){
  if (!actx) return;
  const now = actx.currentTime;
  [0, .25, .5].forEach(off => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, now + off); g.gain.exponentialRampToValueAtTime(0.35, now + off + .02); g.gain.exponentialRampToValueAtTime(0.0001, now + off + .2);
    o.connect(g).connect(actx.destination); o.start(now + off); o.stop(now + off + .22);
  });
}
function fire(tm){
  ringing = tm;
  const msg = tm.kind === "timer" ? T[S.settings.lang].timerDone(tm.label) : T[S.settings.lang].remind(tm.label);
  $("alarmKind").textContent = tm.kind === "timer" ? t("timer") : t("reminder");
  $("alarmText").textContent = tm.kind === "timer" ? (tm.label || fmtClock(new Date())) : tm.label;
  $("alarm").hidden = false;
  addEvent(msg);
  beep(); let n = 0;
  beepTimer = setInterval(() => { beep(); if (++n > 40) stopAlarm(); }, 1500);
  try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 400]); } catch {}
  try { if ("Notification" in window && Notification.permission === "granted") new Notification(S.settings.name, {body:msg}); } catch {}
  setTimeout(() => speak(msg, true), 900);
}
function stopAlarm(){ clearInterval(beepTimer); beepTimer = null; ringing = null; $("alarm").hidden = true; stopSpeaking(); afterTurn(true); }
$("alarmStop").onclick = stopAlarm;
setInterval(() => {
  const now = Date.now();
  const due = S.timers.filter(x => x.due <= now);
  if (due.length){
    S.timers = S.timers.filter(x => x.due > now); save();
    if (!ringing) fire(due[0]);
    renderTasks();
  }
  renderStrip();
}, 500);

function renderStrip(){
  const st = $("strip"); st.innerHTML = "";
  for (const x of S.timers.filter(x => x.kind === "timer").sort((a,b) => a.due - b.due)){
    const p = document.createElement("div"); p.className = "pill";
    const b = document.createElement("b"); b.textContent = fmtLeft(x.due - Date.now());
    const l = document.createElement("span"); l.textContent = x.label || t("timer");
    const c = document.createElement("button"); c.textContent = "×"; c.setAttribute("aria-label", t("del"));
    c.onclick = () => { S.timers = S.timers.filter(y => y.id !== x.id); save(); renderTasks(); renderStrip(); };
    p.append(b, l, c); st.append(p);
  }
}
function renderTasks(){
  const cnt = S.timers.length; $("taskCount").hidden = !cnt; $("taskCount").textContent = cnt;
  const tl = $("timerList"); tl.innerHTML = "";
  if (!cnt){ const e = document.createElement("div"); e.className = "empty"; e.textContent = t("noTimers"); tl.append(e); }
  for (const x of [...S.timers].sort((a,b) => a.due - b.due)){
    const r = document.createElement("div"); r.className = "row";
    const tx = document.createElement("div"); tx.className = "txt";
    tx.textContent = (x.kind === "timer" ? t("timer") : t("reminder")) + (x.label ? " · " + x.label : "");
    const m = document.createElement("div"); m.className = "meta";
    m.textContent = new Date(x.due).toLocaleString(LANG[S.settings.lang].loc, {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
    const d = document.createElement("button"); d.textContent = t("del");
    d.onclick = () => { S.timers = S.timers.filter(y => y.id !== x.id); save(); renderTasks(); };
    r.append(tx, m, d); tl.append(r);
  }
  const nl = $("noteList"); nl.innerHTML = "";
  if (!S.notes.length){ const e = document.createElement("div"); e.className = "empty"; e.textContent = t("noNotes"); nl.append(e); }
  for (const n of S.notes){
    const r = document.createElement("div"); r.className = "row";
    const tx = document.createElement("div"); tx.className = "txt"; tx.textContent = n.text;
    const m = document.createElement("div"); m.className = "meta"; m.textContent = new Date(n.at).toLocaleDateString(LANG[S.settings.lang].loc, {day:"numeric", month:"short"});
    const d = document.createElement("button"); d.textContent = t("del");
    d.onclick = () => { S.notes = S.notes.filter(y => y.id !== n.id); save(); renderTasks(); };
    r.append(tx, m, d); nl.append(r);
  }
}
$("noteForm").onsubmit = e => { e.preventDefault(); const v = $("noteInput").value.trim(); if (!v) return; S.notes.unshift({id:uid(), text:v, at:Date.now()}); $("noteInput").value = ""; save(); renderTasks(); };

/* ---------- sheets & settings ---------- */
function openSheet(id){ $(id).hidden = false; }
for (const sh of ["tasksSheet","settingsSheet"]){
  $(sh).addEventListener("click", e => { if (e.target === $(sh) || e.target.hasAttribute("data-close")) { $(sh).hidden = true; if (sh === "settingsSheet") applyLang(); } });
}
$("openTasks").onclick = () => { renderTasks(); openSheet("tasksSheet"); };
$("openSettings").onclick = () => {
  const s = S.settings;
  $("sName").value = s.name; $("sPersona").value = s.persona; $("sPersona").placeholder = PERSONA_DEF[s.lang];
  $("sCity").value = s.city; $("sVoice").checked = s.voice; $("sKeep").checked = s.keep; $("sRate").value = s.rate;
  $("sKey").value = s.apiKey; $("sModel").value = s.model;
  $("sSttKey").value = s.sttKey; $("sSttModel").value = s.sttModel; $("sVocab").value = s.vocab; $("sVocab").placeholder = "Алматы, ҰБТ, Оңай білім…";
  renderStt();
  $("sNice").checked = s.nice; $("sTtsVoice").value = s.ttsVoice;
  renderBrain(); openSheet("settingsSheet");
};
const bind = (id, key, get) => $(id).addEventListener("input", () => { S.settings[key] = get($(id)); save(); if (key === "apiKey") renderBrain(); });
bind("sName", "name", el => el.value.trim() || "Вижен");
bind("sPersona", "persona", el => el.value);
bind("sCity", "city", el => el.value.trim());
bind("sVoice", "voice", el => el.checked);
bind("sKeep", "keep", el => el.checked);
bind("sRate", "rate", el => Number(el.value));
bind("sKey", "apiKey", el => el.value.trim());
bind("sModel", "model", el => el.value.trim());
bind("sSttKey", "sttKey", el => el.value.trim());
bind("sSttModel", "sttModel", el => el.value.trim());
bind("sVocab", "vocab", el => el.value);
bind("sNice", "nice", el => el.checked);
bind("sTtsVoice", "ttsVoice", el => el.value);
const renderStt = () => { $("sttBadge").textContent = useCloud() ? t("sttCloud") : t("sttBrowser"); };
$("sSttKey").addEventListener("input", renderStt);
$("testVoice").onclick = () => { unlock(); speak(T[S.settings.lang].voiceTest(S.settings.name), true); };
$("askNotif").onclick = async () => { try { if ("Notification" in window) await Notification.requestPermission(); } catch {} };
$("clearChat").onclick = () => { S.history = []; save(); $("settingsSheet").hidden = true; applyLang(); renderHello(); };

applyLang();
renderStrip();
if (S.settings.wake) setTimeout(startWake, 600);
})();
</script>
